<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогнозы ЧМ-2026</title>
<style>
:root{--bg:#0b0f14;--bg-elev:#11161d;--bg-card:#161c25;--border:#232b36;--text:#e8ecf1;--text-dim:#8a96a6;--accent:#ffb02e;--accent-dim:#4a3a1a;--win:#34d399;--lose:#f87171;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Roboto,sans-serif;padding-bottom:80px;}
.topbar{position:sticky;top:0;z-index:50;background:rgba(11,15,20,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-weight:700;font-size:18px;}
.brand .yr{color:var(--accent);}
.refresh-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text);border-radius:100px;padding:8px 14px;font-size:13px;cursor:pointer;}
.refresh-btn.spinning{opacity:0.6;}
.tabs{display:flex;gap:4px;padding:10px 14px 0;overflow-x:auto;border-bottom:1px solid var(--border);}
.tab{background:none;border:none;color:var(--text-dim);padding:10px 14px 14px;font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.page{display:none;padding:18px;max-width:720px;margin:0 auto;}
.page.active{display:block;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px;}
.stat-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;}
.stat-card .value{font-size:26px;font-weight:700;}
.stat-card .value.accent{color:var(--accent);}
.section-title{font-size:16px;font-weight:700;margin:24px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';width:3px;height:16px;background:var(--accent);border-radius:2px;}
.match-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.match-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:10px;}
.status-badge{background:var(--accent-dim);color:var(--accent);padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;}
.match-teams{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:12px;}
.vs{color:var(--text-dim);font-weight:400;font-size:13px;padding:0 8px;}
.score{color:var(--accent);}
.odds-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.odds-pill{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;text-align:center;padding:8px 4px;}
.pct{font-weight:700;font-size:15px;}
.lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;margin-top:2px;}
.predict-btn{width:100%;background:var(--accent);color:#1a1305;border:none;border-radius:10px;padding:10px;font-weight:700;font-size:13px;cursor:pointer;}
.result-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;}
.result-row+.result-row{border-top:1px solid var(--border);}
.badge-no{color:var(--lose);font-weight:700;}
.points-tag{background:var(--accent-dim);color:var(--accent);font-weight:700;padding:3px 10px;border-radius:100px;font-size:12px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:flex-end;}
.modal-overlay.active{display:flex;}
.modal{background:var(--bg-elev);border-radius:20px 20px 0 0;padding:20px 18px 28px;width:100%;max-height:85vh;overflow-y:auto;border-top:1px solid var(--border);}
.modal h3{font-size:18px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;}
.field input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:15px;}
.score-inputs{display:flex;align-items:center;gap:10px;}
.score-inputs input{text-align:center;}
.choice-row{display:flex;gap:8px;}
.choice-btn{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;}
.choice-btn.selected{background:var(--accent);color:#1a1305;border-color:var(--accent);}
.confidence-row{display:flex;gap:6px;}
.conf-dot{flex:1;height:36px;border-radius:8px;background:var(--bg);border:1px solid var(--border);cursor:pointer;}
.conf-dot.selected{background:var(--accent);border-color:var(--accent);}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.btn-cancel{flex:1;background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:10px;padding:12px;font-weight:600;}
.btn-submit{flex:2;background:var(--accent);border:none;color:#1a1305;border-radius:10px;padding:12px;font-weight:700;}
.group-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.group-card h4{font-size:12px;color:var(--accent);text-transform:uppercase;margin-bottom:8px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#1a1305;padding:12px 20px;border-radius:100px;font-size:13px;font-weight:700;opacity:0;transition:all 0.25s ease;z-index:200;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.leader-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;}
.leader-row+.leader-row{border-top:1px solid var(--border);}
.leader-rank{width:26px;height:26px;border-radius:50%;background:var(--bg-elev);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:10px;}
.leader-rank.gold{background:var(--accent);color:#1a1305;}
</style>
</head>
<body>
<div class="topbar">
<div class="brand">⚽ ЧМ <span class="yr">2026</span></div>
<button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">↻ Обновить</button>
</div>
<div class="tabs">
<button class="tab active" data-page="home">Главная</button>
<button class="tab" data-page="predict">Прогнозы</button>
<button class="tab" data-page="results">Результаты</button>
<button class="tab" data-page="bracket">Сетка</button>
<button class="tab" data-page="leaders">Рейтинг</button>
</div>
<div class="page active" id="page-home">
<div class="stat-grid">
<div class="stat-card"><div class="label">Прогнозов</div><div class="value" id="h-total">—</div></div>
<div class="stat-card"><div class="label">Точность</div><div class="value accent" id="h-accuracy">—</div></div>
<div class="stat-card"><div class="label">Сыграно матчей</div><div class="value" id="h-played">—</div></div>
<div class="stat-card"><div class="label">Средний балл</div><div class="value" id="h-avgpts">—</div></div>
</div>
<div class="section-title">Ближайшие матчи</div>
<div id="h-upcoming"></div>
</div>
<div class="page" id="page-predict">
<div class="section-title">Матчи без прогноза</div>
<div id="predict-list"></div>
</div>
<div class="page" id="page-results">
<div class="section-title">Завершённые матчи</div>
<div id="results-list"></div>
</div>
<div class="page" id="page-bracket">
<div class="section-title">Группы и расписание</div>
<div id="bracket-list"></div>
</div>
<div class="page" id="page-leaders">
<div class="section-title">Рейтинг участников</div>
<div id="leaders-list"></div>
</div>
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h3 id="modalTitle">Матч</h3>
<div class="field"><label>Твоё имя</label><input type="text" id="m-username" placeholder="Например, Рамазан"></div>
<div class="field"><label>Исход</label>
<div class="choice-row" id="m-outcome-row">
<button class="choice-btn" data-val="П1" id="m-out-1"></button>
<button class="choice-btn" data-val="Х">Х</button>
<button class="choice-btn" data-val="П2" id="m-out-2"></button>
</div></div>
<div class="field"><label>Точный счёт</label>
<div class="score-inputs">
<input type="number" id="m-score-home" min="0" max="20" placeholder="0">
<span>:</span>
<input type="number" id="m-score-away" min="0" max="20" placeholder="0">
</div></div>
<div class="field"><label>Обе забьют?</label>
<div class="choice-row">
<button class="choice-btn" data-val="Да" id="m-btts-yes">Да</button>
<button class="choice-btn" data-val="Нет" id="m-btts-no">Нет</button>
</div></div>
<div class="field"><label>Тотал</label>
<div class="choice-row">
<button class="choice-btn" data-val="Больше 2.5" id="m-total-over">Больше 2.5</button>
<button class="choice-btn" data-val="Меньше 2.5" id="m-total-under">Меньше 2.5</button>
</div></div>
<div class="field"><label>Уверенность</label>
<div class="confidence-row" id="m-confidence-row">
<div class="conf-dot" data-val="1"></div>
<div class="conf-dot" data-val="2"></div>
<div class="conf-dot" data-val="3"></div>
<div class="conf-dot" data-val="4"></div>
<div class="conf-dot" data-val="5"></div>
</div></div>
<div class="modal-actions">
<button class="btn-cancel" onclick="closeModal()">Отмена</button>
<button class="btn-submit" onclick="submitPrediction()">Сохранить прогноз</button>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
  </html>
